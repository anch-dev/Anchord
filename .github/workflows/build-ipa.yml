name: Build iOS IPA

# Two entry points:
#   - workflow_dispatch: run manually from the Actions tab, pick a configuration.
#   - push to main that touches Swift/project files: automatic build-verification run.
#
# IMPORTANT, read before relying on this:
# Apple requires every binary that runs on a real iOS device to be
# cryptographically signed with a Developer Program certificate + matching
# provisioning profile. There is no way around that at the OS level.
#
#   - If the four secrets below are configured in this repo
#     (Settings -> Secrets and variables -> Actions), this workflow produces
#     a genuinely signed, installable ad-hoc IPA:
#       IOS_DIST_CERT_BASE64        base64 of your .p12 distribution certificate
#       IOS_DIST_CERT_PASSWORD      the password you set when exporting the .p12
#       IOS_PROVISION_PROFILE_BASE64 base64 of your .mobileprovision (ad-hoc, with
#                                    your test devices' UDIDs registered)
#       IOS_TEAM_ID                 your Apple Developer Team ID (Membership tab)
#
#     To get the base64 values locally:
#       base64 -i Certificates.p12 | pbcopy
#       base64 -i YourProfile.mobileprovision | pbcopy
#
#   - If those secrets are absent, the workflow still builds and archives the
#     app with signing disabled, and packages an UNSIGNED .ipa. That file
#     will NOT install on a real device via Finder/Xcode/TestFlight. It's
#     useful for (a) confirming the project actually compiles, and
#     (b) tools that do their own re-signing at install time (e.g. AltStore,
#     Sideloadly) can take an unsigned/ad-hoc-shaped IPA and sign it with
#     your own free Apple ID.
#
# Also note: this project's deployment target is iOS 27.0, which is very
# recent. The job prints which Xcode/SDK versions are actually available on
# the runner before building, so a failure here is easy to diagnose rather
# than a cryptic SDK error.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options: [Release, Debug]
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "Anchord.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  verify-build:
    name: Verify it compiles (Simulator, no signing required)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$LATEST" ] && LATEST="/Applications/Xcode.app"
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          echo "--- installed SDKs ---"
          xcodebuild -showsdks

      - name: List schemes (sanity check the project parses)
        run: xcodebuild -project Anchord.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Anchord.xcodeproj \
            -scheme Anchord \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  build-ipa:
    name: Archive & export IPA
    runs-on: macos-26
    needs: verify-build
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$LATEST" ] && LATEST="/Applications/Xcode.app"
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Set up signing (if secrets are configured)
        id: signing
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$CERT_BASE64" ] || [ -z "$PROFILE_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured -- building an UNSIGNED archive. See the comment block at the top of this workflow file for what to add."
            exit 0
          fi

          echo "has_signing=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Archive (signed)
        if: steps.signing.outputs.has_signing == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Anchord.xcodeproj \
            -scheme Anchord \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -archivePath "$RUNNER_TEMP/Anchord.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="${{ steps.signing.outputs.profile_uuid }}" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export signed IPA
        if: steps.signing.outputs.has_signing == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Anchord.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive (unsigned fallback)
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          xcodebuild archive \
            -project Anchord.xcodeproj \
            -scheme Anchord \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -archivePath "$RUNNER_TEMP/Anchord.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$RUNNER_TEMP/Anchord.xcarchive/Products/Applications/Anchord.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -r -q Anchord-UNSIGNED.ipa Payload && rm -rf Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anchord-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Upload .xcarchive (for debugging a failed export)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Anchord-xcarchive
          path: ${{ runner.temp }}/Anchord.xcarchive
          if-no-files-found: warn
